name: One-off signed GOP convergence (two checkpoints)
on:
  pull_request:
    paths:
      - '.github/workflows/qemu-gop-convergence.yml'
permissions:
  contents: read
jobs:
  observed-pm:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'dev/stage4-nvme'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install unchanged signed-image and emulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils cpio gcc-13 gnu-efi rustc python3 openssl \
            sbsigntool efitools gdisk mtools qemu-system-x86 ovmf python3-virt-firmware gdb
      - name: Build the ordinary production and staged signed images
        run: bash scripts/build.sh --supervisor-staging
      - name: Observe only fault and edited echo in one signed KVM PM24 session
        run: |
          set -euo pipefail
          mkdir -p build/gop-convergence
          test -c /dev/kvm
          # Same ephemeral KVM device setup as qemu-clock-bootstrap.yml.
          sudo chmod a+rw /dev/kvm
          { uname -a; lscpu; qemu-system-x86_64 --version; } > build/gop-convergence/host.txt
          python3 .github/diagnostics/gop-convergence.py
      - name: Preserve actual UART and GOP observation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-gop-convergence
          retention-days: 14
          if-no-files-found: error
          path: |
            build/gop-convergence/
            build/build-provenance.json
            build/kernel.elf
            build/initramfs.cpio
            build/agentos.efi
            build/agentos.unsigned.efi
            build/db.cer
            build/db.esl
            build/supervisor-staging/
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.json
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.log
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.bin
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.efi
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.ppm
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.txt
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/esp.raw
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/OVMF_VARS.secboot.fd
