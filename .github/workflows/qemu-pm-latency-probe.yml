name: One-off KVM PM host/guest latency diagnosis

on:
  pull_request:
    paths:
      - '.github/workflows/qemu-pm-latency-probe.yml'

permissions:
  contents: read

jobs:
  paired-pm:
    if: github.event.pull_request.head.ref == 'dev/stage4-nvme'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the same pinned toolchain and KVM dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils cpio gcc-13 gnu-efi rustc python3 openssl \
            sbsigntool efitools gdisk mtools qemu-system-x86 ovmf python3-virt-firmware gdb
      - name: Build matched signed images with failure-only test observation
        run: |
          set -euo pipefail
          python3 .github/diagnostics/pm-latency.py prepare
          bash scripts/build.sh --supervisor-staging
      - name: One paired KVM PM24 2-vCPU diagnostic execution
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          { uname -a; lscpu; qemu-system-x86_64 --version; qemu-system-x86_64 -accel help; } > build/pm-latency/host.txt
          python3 .github/diagnostics/pm-latency.py run
      - name: Preserve actual signed images and all raw timing evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-latency-pair
          retention-days: 14
          if-no-files-found: error
          path: |
            build/pm-latency/
            build/build-provenance.json
            build/agentos.efi
            build/agentos.unsigned.efi
            build/kernel.elf
            build/initramfs.cpio
            build/db.cer
            build/db.esl
            build/supervisor-staging/
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/*.json
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/*.log
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/*.bin
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/*.efi
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/*.ppm
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/*.txt
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/esp.raw
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-control/OVMF_VARS.secboot.fd
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.json
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.log
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.bin
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.efi
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.ppm
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/*.txt
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/esp.raw
            build/check/qemu-cpu2-no-hpet-kvm-session-sv-test/OVMF_VARS.secboot.fd
