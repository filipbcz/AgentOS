name: One-off GOP host profiler capability preflight

on:
  pull_request:
    paths:
      - '.github/workflows/qemu-gop-profiler-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    if: github.event.pull_request.head.ref == 'dev/stage4-nvme'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Test existing unprivileged observation capabilities (no guest boot)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p profile-preflight
          exec > >(tee profile-preflight/preflight.log) 2>&1
          cd profile-preflight
          status=0
          probe() {
            local name="$1"
            shift
            printf '\n--- %s ---\n' "$name"
            printf '%q ' "$@"
            printf '\n'
            "$@" > "$name.txt" 2>&1
            local rc=$?
            cat "$name.txt"
            printf '%s=%d\n' "$name" "$rc" | tee -a status.txt
            if [[ "$rc" != 0 ]]; then status=1; fi
          }
          printf 'HEAD=%s RUN=%s ATTEMPT=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          uname -a
          id
          grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status
          for file in /proc/sys/kernel/perf_event_paranoid /proc/sys/kernel/kptr_restrict /proc/sys/kernel/yama/ptrace_scope; do
            printf '%s: ' "$file"
            cat "$file" || :
          done
          ls -l /dev/kvm /sys/kernel/tracing /sys/kernel/debug/tracing 2>&1 || :
          probe kvm_existing_access bash -c 'test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm'
          probe perf_version perf version
          probe guest_hardware_event perf record --clockid mono --switch-events -e cycles:G -o guest-open.data -- sleep 0.1
          probe host_context_switch_events perf record --clockid mono --switch-events -e cpu-clock:u -o switch-open.data -- sleep 0.1
          probe kvm_entry_exit_events perf record --clockid mono -e kvm:kvm_entry -e kvm:kvm_exit -o kvm-open.data -- sleep 0.1
          probe scheduler_event perf record --clockid mono -e sched:sched_switch -o sched-open.data -- sleep 0.1
          for event in kvm/kvm_entry kvm/kvm_exit sched/sched_switch; do
            name="$(printf '%s' "$event" | tr / _)"
            probe "format_$name" bash -c 'for root in /sys/kernel/tracing /sys/kernel/debug/tracing; do if test -r "$root/events/$1/format"; then cat "$root/events/$1/format"; exit; fi; done; echo "No readable event format for $1"; exit 1' _ "$event"
          done
          # These opens alone do NOT prove guest RIP attribution. A positive
          # result would still require a known-address KVM sample capability
          # check before any actual signed AgentOS session. No guest here.
          printf '\nAgentOS guest launches=0\n'
          if [[ "$status" != 0 ]]; then
            echo 'BLOCKED: required unprivileged observation capabilities unavailable.'
          else
            echo 'OPEN CHECKS ONLY: guest RIP attribution and real context-switch records not yet validated.'
          fi
          printf '%s\n' "$status" > preflight-exit.txt
          exit "$status"
      - name: Preserve raw preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gop-profiler-preflight
          path: profile-preflight/
          retention-days: 14
          if-no-files-found: error
