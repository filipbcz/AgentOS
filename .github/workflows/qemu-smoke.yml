name: QEMU Secure Boot smoke (supplementary)

on:
  pull_request:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'user/**'
      - 'scripts/**'
      - '.github/workflows/qemu-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete emulator jobs when a newer PR revision arrives.
concurrency:
  group: agentos-qemu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secureboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cpus: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned EFI build and software-emulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils cpio gcc-13 gnu-efi rustc python3 openssl \
            sbsigntool efitools gdisk mtools qemu-system-x86 ovmf \
            python3-virt-firmware
      - name: Build and verify signed UEFI EFI with pinned toolchain
        run: bash scripts/build.sh
      - name: Boot real guest on OVMF Secure Boot (QEMU TCG; not VirtualBox)
        env:
          CPU_COUNT: ${{ matrix.cpus }}
        run: |
          set -euo pipefail
          code=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -f "$code"
          test -f "$vars"
          python3 scripts/qemu-smoke.py --cpus "$CPU_COUNT" \
            --ovmf-code "$code" --ovmf-vars "$vars" --timeout 720
      - name: Verify real UART, PS2/GOP, service control, runtime idle and graceful shutdown
        env:
          CPU_COUNT: ${{ matrix.cpus }}
        run: |
          set -euo pipefail
          python3 scripts/qemu-smoke.py --cpus "$CPU_COUNT" --session \
            --ovmf-code /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            --ovmf-vars /usr/share/OVMF/OVMF_VARS_4M.fd --timeout 720
      - name: Preserve boot evidence even if the guest fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-secureboot-${{ matrix.cpus }}cpu
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/build-provenance.json
            build/agentos.efi
            build/agentos.unsigned.efi
            build/kernel.elf
            build/initramfs.cpio
            build/db.esl
            build/check/qemu-cpu${{ matrix.cpus }}/com1.log
            build/check/qemu-cpu${{ matrix.cpus }}/qemu-stderr.log
            build/check/qemu-cpu${{ matrix.cpus }}/smoke.json
            build/check/qemu-cpu${{ matrix.cpus }}/failure.json
            build/check/qemu-cpu${{ matrix.cpus }}/secureboot-vars.txt
            build/check/qemu-cpu${{ matrix.cpus }}/OVMF_VARS.secboot.fd
            build/check/qemu-cpu${{ matrix.cpus }}/failed-screen.ppm
            build/check/qemu-cpu${{ matrix.cpus }}/shell-screen.ppm
            build/check/qemu-cpu${{ matrix.cpus }}-session/com1.log
            build/check/qemu-cpu${{ matrix.cpus }}-session/qemu-stderr.log
            build/check/qemu-cpu${{ matrix.cpus }}-session/smoke.json
            build/check/qemu-cpu${{ matrix.cpus }}-session/failure.json
            build/check/qemu-cpu${{ matrix.cpus }}-session/failed-screen.ppm
            build/check/qemu-cpu${{ matrix.cpus }}-session/shell-screen.ppm
            build/check/qemu-cpu${{ matrix.cpus }}-session/com1-input.bin
            build/check/qemu-cpu${{ matrix.cpus }}-session/keyboard-before.ppm
            build/check/qemu-cpu${{ matrix.cpus }}-session/keyboard-after.ppm
            build/check/qemu-cpu${{ matrix.cpus }}-session/secureboot-vars.txt
            build/check/qemu-cpu${{ matrix.cpus }}-session/OVMF_VARS.secboot.fd
