name: Isolated KVM x2APIC firmware capability probe

# One historical PR experiment is archived in PLAN_IMPLEMENTACE.md.
# Do not automatically repeat the known sparse firmware failure.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x2apic-probe:
    if: github.repository == 'filipbcz/AgentOS' && github.ref == 'refs/heads/dev/stage4-nvme'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install same EFI and KVM dependencies as clock bootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils cpio gcc-13 gnu-efi rustc python3 openssl \
            sbsigntool efitools gdisk mtools qemu-system-x86 ovmf \
            python3-virt-firmware gdb
      - name: Use existing KVM device only
        run: |
          set -euo pipefail
          test -c /dev/kvm
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Low-ID control followed by one sparse pre-boot topology
        env:
          PROBE_PR_HEAD: ${{ github.sha }}
        run: python3 tests/platform-x2apic/probe.py
      - name: Preserve environment, raw QMP, live MADT and CPU observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-kvm-x2apic-probe
          if-no-files-found: error
          retention-days: 14
          path: build/x2apic-probe/
