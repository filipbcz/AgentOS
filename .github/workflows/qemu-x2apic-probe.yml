name: Isolated KVM x2APIC firmware capability probe

on:
  pull_request:
    paths:
      - 'tests/platform-x2apic/**'
      - '.github/workflows/qemu-x2apic-probe.yml'

permissions:
  contents: read

jobs:
  x2apic-probe:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'dev/stage4-nvme' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install same EFI and KVM dependencies as clock bootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils cpio gcc-13 gnu-efi rustc python3 openssl \
            sbsigntool efitools gdisk mtools qemu-system-x86 ovmf \
            python3-virt-firmware gdb
      - name: Use existing KVM device only
        run: |
          set -euo pipefail
          test -c /dev/kvm
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Low-ID control followed by one sparse pre-boot topology
        env:
          PROBE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tests/platform-x2apic/probe.py
      - name: Preserve environment, raw QMP, live MADT and CPU observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-kvm-x2apic-probe
          if-no-files-found: error
          retention-days: 14
          path: build/x2apic-probe/
