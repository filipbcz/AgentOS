name: Isolated signed runtime SMP preemption proof
# One authorized ordered 2/4/8 attempt; no automatic repeats.
on:
  pull_request:
    types: [synchronize]
    paths:
      - 'tests/preemption-proof/client.S'
      - 'tests/preemption-proof/proof.py'
      - 'tests/preemption-proof/run.py'
      - '.github/workflows/qemu-preemption-proof.yml'
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'filipbcz/AgentOS' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'dev/stage4-nvme' && github.event.pull_request.head.repo.full_name == github.repository && github.event.before == '3a299dbb6977ccf749001fc09dfa22d6f5475330' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Deterministic verifier rejection cases before any guest
        run: python3 tests/preemption-proof/proof.py
      - name: Install existing pinned signed build and debugger dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils cpio gcc-13 gnu-efi rustc python3 openssl sbsigntool efitools gdisk mtools qemu-system-x86 ovmf python3-virt-firmware gdb
      - name: Build unchanged production and existing staging
        run: bash scripts/build.sh --supervisor-staging
      - name: Exact 2 CPU preflight and prior profile proof, no guest
        id: preflight2
        if: success()
        run: python3 tests/preemption-proof/run.py --preflight 2
      - name: Archive 2 CPU preflight before guest
        if: always() && steps.preflight2.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: preemption-preflight-2cpu
          if-no-files-found: error
          retention-days: 14
          path: |
            build/preemption-proof-2cpu/preflight.json
            build/preemption-proof-2cpu/startup-host.json
            build/preemption-proof-2cpu/client-disassembly.txt
      - name: One signed staged TCG HPET 2 CPU guest
        if: success() && steps.preflight2.outcome == 'success'
        run: python3 tests/preemption-proof/run.py --guest 2
      - name: Preserve actual 2 CPU evidence
        if: always() && steps.preflight2.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: preemption-proof-2cpu
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/build-provenance.json
            build/kernel.elf
            build/initramfs.cpio
            build/agentos.efi
            build/agentos.unsigned.efi
            build/db.cer
            build/db.esl
            build/preemption-proof-2cpu/*.json
            build/preemption-proof-2cpu/*.jsonl
            build/preemption-proof-2cpu/*.log
            build/preemption-proof-2cpu/*.bin
            build/preemption-proof-2cpu/*.elf
            build/preemption-proof-2cpu/*.efi
            build/preemption-proof-2cpu/*.cpio
            build/preemption-proof-2cpu/*.txt
            build/preemption-proof-2cpu/*.ppm
            build/preemption-proof-2cpu/*.fd
            build/preemption-proof-2cpu/preempt-runner
            build/preemption-proof-2cpu/esp.raw
      - name: Exact 4 CPU preflight and prior profile proof, no guest
        id: preflight4
        if: success()
        run: python3 tests/preemption-proof/run.py --preflight 4
      - name: Archive 4 CPU preflight before guest
        if: always() && steps.preflight4.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: preemption-preflight-4cpu
          if-no-files-found: error
          retention-days: 14
          path: |
            build/preemption-proof-4cpu/preflight.json
            build/preemption-proof-4cpu/startup-host.json
            build/preemption-proof-4cpu/client-disassembly.txt
      - name: One signed staged TCG HPET 4 CPU guest
        if: success() && steps.preflight4.outcome == 'success'
        run: python3 tests/preemption-proof/run.py --guest 4
      - name: Preserve actual 4 CPU evidence
        if: always() && steps.preflight4.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: preemption-proof-4cpu
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/build-provenance.json
            build/kernel.elf
            build/initramfs.cpio
            build/agentos.efi
            build/agentos.unsigned.efi
            build/db.cer
            build/db.esl
            build/preemption-proof-4cpu/*.json
            build/preemption-proof-4cpu/*.jsonl
            build/preemption-proof-4cpu/*.log
            build/preemption-proof-4cpu/*.bin
            build/preemption-proof-4cpu/*.elf
            build/preemption-proof-4cpu/*.efi
            build/preemption-proof-4cpu/*.cpio
            build/preemption-proof-4cpu/*.txt
            build/preemption-proof-4cpu/*.ppm
            build/preemption-proof-4cpu/*.fd
            build/preemption-proof-4cpu/preempt-runner
            build/preemption-proof-4cpu/esp.raw
      - name: Exact 8 CPU preflight and prior profile proof, no guest
        id: preflight8
