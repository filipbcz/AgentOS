        if: always() && steps.preflight8.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: preemption-proof-8cpu
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/build-provenance.json
            build/kernel.elf
            build/initramfs.cpio
            build/agentos.efi
            build/agentos.unsigned.efi
            build/db.cer
            build/db.esl
            build/preemption-proof-8cpu/*.json
            build/preemption-proof-8cpu/*.jsonl
            build/preemption-proof-8cpu/*.log
            build/preemption-proof-8cpu/*.bin
            build/preemption-proof-8cpu/*.elf
            build/preemption-proof-8cpu/*.efi
            build/preemption-proof-8cpu/*.cpio
            build/preemption-proof-8cpu/*.txt
            build/preemption-proof-8cpu/*.ppm
            build/preemption-proof-8cpu/*.fd
            build/preemption-proof-8cpu/preempt-runner
            build/preemption-proof-8cpu/esp.raw
