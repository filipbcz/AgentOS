name: Host checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rustc gcc-13 binutils python3
      - name: Parse PowerShell harnesses
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $pTokens = $null
            $pErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$pTokens, [ref]$pErrors)
            if ($pErrors.Count) { throw ($pErrors | Out-String) }
          }
      - name: Test host logic and link kernel and user programs
        env:
          RUSTC: /usr/bin/rustc
          CC: /usr/bin/gcc-13
        run: bash scripts/check-build.sh
