name: Host checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rustc gcc-13 binutils python3
      - name: Parse PowerShell harnesses
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $pTokens = $null
            $pErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$pTokens, [ref]$pErrors)
            if ($pErrors.Count) { throw ($pErrors | Out-String) }
          }
      - name: Test host logic and link kernel and user programs
        env:
          RUSTC: /usr/bin/rustc
          CC: /usr/bin/gcc-13
        run: bash scripts/check-build.sh
      - name: Run separate production physical allocator exhaustion proof
        env:
          RUSTC: /usr/bin/rustc
        run: python3 scripts/physical_oom_evidence.py --directory build/check/physical-oom --commit "$(git rev-parse HEAD)"
      - name: Preserve physical allocator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-allocator-oom-host
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/check/physical-oom/physical-oom.json
            build/check/physical-oom/physical-oom.log

  # One approved build-only preflight on the exact PR transition. No new event.
  fresh-candidate-layout-once:
    if: github.repository == 'filipbcz/AgentOS' && github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 2 && github.event.pull_request.head.repo.full_name == 'filipbcz/AgentOS' && github.event.pull_request.head.ref == 'dev/stage4-nvme' && github.event.before == '75a135f7e4f0f72c35fea87e87552b2f5f66b1f8' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '7c51d11974c3cef90718f53a0fb4abc0d2b9544f'
          persist-credentials: false
      - name: Verify exact unaccepted candidate before build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7c51d11974c3cef90718f53a0fb4abc0d2b9544f'
          test "$(git rev-parse HEAD^{tree})" = '4d04be1cac3f1ed8823a6ccc2a18a6e1dec78e90'
          test -z "$(git status --porcelain --untracked-files=normal)"
          git log -1 --format='%H %T'
      - name: Install pinned signed build and offline layout dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils cpio gcc-13 gnu-efi rustc python3 openssl sbsigntool efitools gdisk mtools gdb
      - name: Build exact candidate signed distribution and staging inputs
        run: bash scripts/build.sh --supervisor-staging
      - name: Verify actual signed payload and matching debug layout
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/preemption-proof/layout-preflight.py
      - name: Preserve candidate build and raw layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-candidate-layout-only
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/build-provenance.json
            build/kernel.elf
            build/initramfs.cpio
            build/agentos.efi
            build/agentos.unsigned.efi
            build/db.cer
            build/db.esl
            build/fresh-layout/
